name: Sign Fast Browser

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: fast-browser-signing
  cancel-in-progress: false

jobs:
  sign:
    name: Sigstore sign and verify
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    env:
      FAST_BROWSER_EXE: C:\src\browser-project\Fast-Browser-v1.2-Final\Fast-Browser-v1.2-Final-Setup.exe
      FAST_BROWSER_BUNDLE: C:\src\browser-project\Fast-Browser-v1.2-Final\Fast-Browser-v1.2-Final-Setup.exe.github-actions.sigstore.json
      FAST_BROWSER_HASH: C:\src\browser-project\Fast-Browser-v1.2-Final\Fast-Browser-v1.2-Final-Setup.exe.sha256.txt

    steps:
      - name: Preflight
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:FAST_BROWSER_EXE)) {
            throw "Installer not found: $env:FAST_BROWSER_EXE"
          }
          $cosign = Get-Command cosign-windows-amd64 -ErrorAction Stop
          Write-Host "Cosign: $($cosign.Source)"
          & cosign-windows-amd64 version

      - name: Create SHA-256 checksum
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $hash = (Get-FileHash -LiteralPath $env:FAST_BROWSER_EXE -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Fast-Browser-v1.2-Final-Setup.exe" | Set-Content -LiteralPath $env:FAST_BROWSER_HASH -Encoding ascii
          Get-Content -LiteralPath $env:FAST_BROWSER_HASH

      - name: Sign with GitHub OIDC and Sigstore
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath $env:FAST_BROWSER_BUNDLE -Force -ErrorAction SilentlyContinue
          & cosign-windows-amd64 sign-blob `
            --yes `
            --bundle $env:FAST_BROWSER_BUNDLE `
            $env:FAST_BROWSER_EXE
          if ($LASTEXITCODE -ne 0) { throw "Cosign signing failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $env:FAST_BROWSER_BUNDLE)) { throw "Sigstore bundle was not created" }

      - name: Verify exact GitHub Actions identity
        shell: powershell
        env:
          EXPECTED_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Expected identity: $env:EXPECTED_IDENTITY"
          & cosign-windows-amd64 verify-blob `
            $env:FAST_BROWSER_EXE `
            --bundle $env:FAST_BROWSER_BUNDLE `
            --certificate-identity $env:EXPECTED_IDENTITY `
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          if ($LASTEXITCODE -ne 0) { throw "Cosign verification failed with exit code $LASTEXITCODE" }

      - name: Final status
        shell: powershell
        run: |
          Write-Host "SIGNING COMPLETE"
          Write-Host "Installer: $env:FAST_BROWSER_EXE"
          Write-Host "Bundle:    $env:FAST_BROWSER_BUNDLE"
          Write-Host "SHA-256:   $env:FAST_BROWSER_HASH"
